name: Rieth independently seeded TEP normal evaluation

on:
  pull_request:
    paths:
      - "benchmarks/**"
      - ".github/workflows/tep-rieth-external.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-normal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install model and original RData reading dependencies
        run: |
          python -m pip install -r benchmarks/requirements.txt
          python -m pip install pyreadr==0.5.7
      - name: Download only official versioned fault-free Rieth RData and validate 16 independent runs
        run: python -m benchmarks.rieth_independent "$RUNNER_TEMP/rieth_normal" --output-dir "$RUNNER_TEMP/rieth_report"
      - name: Archive independent normal-seed calibration and held-out false-alarm audit
        uses: actions/upload-artifact@v4
        with:
          name: l5-tep-rieth-independent-normal
          path: |
            ${{ runner.temp }}/rieth_report/tep_rieth_normal_report.json
            ${{ runner.temp }}/rieth_report/tep_rieth_normal_scoreboard.md
          retention-days: 30
