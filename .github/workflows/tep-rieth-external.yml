name: Rieth independently seeded TEP normal evaluation

on:
  pull_request:
    paths:
      - "l5/**"
      - "benchmarks/*.py"
      - "!benchmarks/test_*.py"
      - "benchmarks/*.json"
      - "benchmarks/requirements*.txt"
      - ".github/workflows/tep-rieth-external.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tep-rieth-${{ github.ref }}
  cancel-in-progress: true

jobs:
  independent-normal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: benchmarks/requirements*.txt
      - name: Install model and original RData reading dependencies
        run: |
          python -m pip install -r benchmarks/requirements.txt
          python -m pip install pandas==2.3.3 pyreadr==0.5.7
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/rieth_normal
          key: tep-rieth-normal-12d1055b-4f45afaf
      - name: Download only official versioned fault-free Rieth RData and validate 16 independent runs
        run: python -m benchmarks.rieth_independent "$RUNNER_TEMP/rieth_normal" --output-dir "$RUNNER_TEMP/rieth_report"
      - name: Check independently seeded numerical outcomes
        run: python -m benchmarks.verify_reports rieth "$RUNNER_TEMP/rieth_report"
      - name: Archive independent normal-seed calibration and held-out false-alarm audit
        uses: actions/upload-artifact@v4
        with:
          name: l5-tep-rieth-independent-normal
          path: |
            ${{ runner.temp }}/rieth_report/tep_rieth_normal_report.json
            ${{ runner.temp }}/rieth_report/tep_rieth_normal_scoreboard.md
          retention-days: 30
