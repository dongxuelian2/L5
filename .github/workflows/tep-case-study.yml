name: TEP real-data case study

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tep-case-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-data:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/rieth-originals
          key: tep-rieth-v1-12d1055b-4f45afaf-c2f1aabc
      - name: Verify official originals and extract predeclared independent runs
        run: |
          python -m examples.tep.prepare --source-dir "$RUNNER_TEMP/rieth-originals" --cache-dir "$RUNNER_TEMP/tep-cache" --source fault-free-training --faults 0 --runs 1 2 --download
          python -m examples.tep.prepare --source-dir "$RUNNER_TEMP/rieth-originals" --cache-dir "$RUNNER_TEMP/tep-cache" --source fault-free-testing --faults 0 --runs 1 2 --download
          python -m examples.tep.prepare --source-dir "$RUNNER_TEMP/rieth-originals" --cache-dir "$RUNNER_TEMP/tep-cache" --source faulty-testing --faults 1 3 5 --runs 1 2 --download
      - name: Run nine algorithms through Workspace, Experiment and Incident
        run: python -m examples.tep.run --data-dir "$RUNNER_TEMP/tep-workspace" --cache-dir "$RUNNER_TEMP/tep-cache" --output-dir "$RUNNER_TEMP/tep-results" --investigate
      - name: Verify protocol, saved metrics and model reuse
        run: python -m examples.tep.verify "$RUNNER_TEMP/tep-results/results.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: l5-tep-independent-case-study
          path: ${{ runner.temp }}/tep-results/
          retention-days: 30
