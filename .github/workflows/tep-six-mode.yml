name: Six-mode TEP normal transfer audit

on:
  pull_request:
    paths:
      - "benchmarks/**"
      - ".github/workflows/tep-six-mode.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  six-mode-normal:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install original MATLAB loader and fixed monitoring baseline dependencies
        run: |
          python -m pip install -r benchmarks/requirements.txt
          python -m pip install scipy==1.16.2
      - name: Download six pinned 1.6MB normal-mode MATLAB sources and score transfer matrix
        run: python -m benchmarks.multimode_normal "$RUNNER_TEMP/tep_six_mode" --output-dir "$RUNNER_TEMP/tep_six_mode_report"
      - name: Archive healthy domain-shift transfer matrix and original SHA-256 hashes
        uses: actions/upload-artifact@v4
        with:
          name: l5-tep-six-mode-normal-transfer
          path: |
            ${{ runner.temp }}/tep_six_mode_report/tep_six_mode_normal_report.json
            ${{ runner.temp }}/tep_six_mode_report/tep_six_mode_normal_scoreboard.md
          retention-days: 30
