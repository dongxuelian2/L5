name: Build and smoke

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: npm ci
      - run: npm run build
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p test_numerical_references.py
      - name: Load the guided dataset
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from l5.workspace import WorkspaceStore

          with TemporaryDirectory() as directory:
              store = WorkspaceStore(Path(directory))
              try:
                  session = store.guided_demo.prepare()["session"]
                  assert store.dataset(session["datasetId"])["metadata"]["rowCount"] > 0
              finally:
                  store.close()
          PY
